<style>
  :root{
    --bg:#0a0b0a; --surface:#141513; --raised:#1c1d1a; --raised2:#232420; --border:#2a2b27;
    --fg:#f2efe6; --muted:#8d8b82; --faint:#5a594f;
    --gold:#c9a86a; --gold-bright:#e2c793; --gold-deep:#a9824f;
    --success:#4c9a6a; --success-bright:#66b483;
    --danger:#c85c4a; --danger-bright:#dd7562; --warn:#d9a441;
    --font-display:"Cormorant Garamond","Times New Roman",serif;
    --font-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --shadow-sm:0 2px 10px rgba(0,0,0,.4);
    --shadow-md:0 8px 24px rgba(0,0,0,.5);
    --shadow-gold:0 6px 20px rgba(201,168,106,.22);
    --shadow-danger:0 6px 20px rgba(200,92,74,.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:var(--font-sans);}
  #app{min-height:100dvh; display:flex; flex-direction:column;}
  .screen{flex:1; display:flex; flex-direction:column; padding:24px 20px calc(24px + env(safe-area-inset-bottom));}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
  .brand svg{width:30px; height:30px; color:var(--gold); filter:drop-shadow(0 0 6px rgba(201,168,106,.35));}
  .avatar{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:14px; flex-shrink:0; box-shadow:var(--shadow-sm);}
  .avatar.sm{width:30px; height:30px; font-size:11px;}
  .brand-text{line-height:1;}
  .brand-text .l{font-family:var(--font-display); font-size:24px; font-weight:600; letter-spacing:.01em;}
  .brand-text .s{font-size:10px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; margin-top:3px;}
  h1{font-family:var(--font-display); font-size:23px; font-weight:600; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:14px; margin:0 0 20px;}
  label{display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:16px 0 6px;}
  select, input[type=text], input[type=password], input[type=tel], textarea{
    width:100%; background:var(--raised); border:1px solid var(--border); color:var(--fg);
    border-radius:10px; padding:14px 14px; font-size:16px; font-family:var(--font-sans); outline:none;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--gold);}
  textarea{min-height:90px; resize:vertical; font-family:inherit;}
  .pin-dots{display:flex; gap:12px; justify-content:center; margin:20px 0;}
  .pin-dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--faint);}
  .pin-dot.filled{background:var(--gold); border-color:var(--gold); box-shadow:0 0 8px rgba(201,168,106,.5);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:auto;}
  .key{background:linear-gradient(180deg,var(--raised2),var(--raised)); border:1px solid var(--border); border-radius:14px; color:var(--fg);
    font-size:22px; font-family:var(--font-sans); padding:18px 0; text-align:center; box-shadow:var(--shadow-sm);}
  .key:active{background:var(--border); box-shadow:none; transform:translateY(1px);}
  .key.ghost{background:transparent; border:none; box-shadow:none; color:var(--muted); font-size:14px;}
  .btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; text-align:center; border:none; border-radius:13px; padding:17px;
    font-size:16px; font-weight:600; font-family:var(--font-sans); margin-top:10px; transition:transform .08s ease, box-shadow .08s ease; text-decoration:none; box-sizing:border-box;}
  .btn svg{width:19px; height:19px; flex-shrink:0;}
  .btn-primary{background:linear-gradient(180deg,var(--gold-bright),var(--gold) 60%,var(--gold-deep)); color:#1a1610; box-shadow:var(--shadow-gold);}
  .btn-primary:active{transform:translateY(1px) scale(.99); box-shadow:0 2px 10px rgba(201,168,106,.18);}
  .btn-secondary{background:linear-gradient(180deg,var(--raised2),var(--raised)); color:var(--fg); border:1px solid var(--border); box-shadow:var(--shadow-sm);}
  .btn-secondary:active{transform:translateY(1px) scale(.99); box-shadow:none;}
  .btn-danger{background:linear-gradient(180deg,var(--danger-bright),var(--danger)); color:#fff; box-shadow:var(--shadow-danger);}
  .btn-danger:active{transform:translateY(1px) scale(.99); box-shadow:0 2px 10px rgba(200,92,74,.18);}
  .btn-assist{background:rgba(200,92,74,.08); color:var(--danger-bright); border:1.5px solid var(--danger); box-shadow:none;}
  .btn-assist:active{transform:translateY(1px) scale(.99); background:rgba(200,92,74,.16);}
  .btn:disabled{opacity:.4;}
  .err{color:var(--danger); font-size:13px; margin-top:10px; min-height:16px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .status-pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; text-transform:uppercase;
    letter-spacing:.08em; padding:5px 10px; border-radius:999px; background:var(--raised); border:1px solid var(--border);}
  .status-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--faint);}
  .status-pill.on .dot{background:var(--success); box-shadow:0 0 0 3px rgba(76,154,106,.2);}
  .sync-pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:5px 10px; border-radius:999px;
    border:1px solid var(--border); background:var(--raised); color:var(--muted);}
  .sync-pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .sync-pill.ok{color:var(--faint);}
  .sync-pill.warn{color:var(--warn); border-color:var(--warn); background:rgba(217,164,65,.08);}
  .sync-pill.danger{color:var(--danger); border-color:var(--danger); background:rgba(200,92,74,.08);}
  .card{background:linear-gradient(160deg,var(--surface),var(--bg) 140%); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
  .card h3{font-family:var(--font-display); margin:0 0 4px; font-size:19px; font-weight:600;}
  .card p{margin:0; color:var(--muted); font-size:13px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .action-tile{background:linear-gradient(160deg,var(--surface),var(--bg) 140%); border:1px solid var(--border); border-radius:16px; padding:20px 14px;
    text-align:center; color:var(--fg); transition:transform .08s ease, background .08s ease; box-shadow:var(--shadow-sm);}
  .action-tile:active{transform:scale(.96); background:var(--raised);}
  .action-tile svg{width:26px; height:26px; margin-bottom:8px; color:var(--gold);}
  .action-tile div{font-size:13px; font-weight:600;}
  .backbar{display:flex; align-items:center; gap:10px; margin-bottom:18px; color:var(--muted); font-size:14px;}
  #qr-reader{border-radius:14px; overflow:hidden; border:1px solid var(--border);}
  .checkpoint-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border);}
  .checkpoint-row:last-child{border-bottom:none;}
  .cp-status{font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:4px 8px; border-radius:6px;}
  .cp-status.pending{color:var(--faint); background:var(--raised);}
  .cp-status.done{color:var(--success); background:rgba(76,154,106,.12);}
  .cp-status.unverified{color:var(--warn); background:rgba(217,164,65,.12);}
  .cp-status.queued{color:var(--warn); background:rgba(217,164,65,.12);}
  .toast{position:fixed; left:20px; right:20px; bottom:calc(20px + env(safe-area-inset-bottom));
    background:var(--raised); border:1px solid var(--border); color:var(--fg); padding:14px 16px;
    border-radius:12px; font-size:14px; text-align:center; z-index:50; box-shadow:var(--shadow-md);}
  .toast.success{border-color:var(--success);}
  .toast.danger{border-color:var(--danger);}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .chip{background:var(--raised); border:1px solid var(--border); border-radius:999px; padding:8px 14px; font-size:13px; transition:transform .08s ease;}
  .chip:active{transform:scale(.94);}
  .chip.active{background:var(--gold); color:#141311; border-color:var(--gold);}
  .photo-preview{width:100%; border-radius:12px; margin-top:10px; border:1px solid var(--border);}
  .muted-link{color:var(--muted); font-size:13px; text-align:center; margin-top:14px;}
  .dispatch-card{border-color:var(--warn); background:linear-gradient(160deg,rgba(217,164,65,.09),rgba(217,164,65,.02)); transition:transform .08s ease;}
  .dispatch-card:active{transform:scale(.98);}
  .dispatch-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--warn); font-weight:600;}
  .icon20{width:20px; height:20px; display:flex;}
  .icon20 svg{width:100%; height:100%;}
  .btn-ack{width:100%;}
  .msg-row{display:flex;}
  .msg-row.admin{justify-content:flex-start;}
  .msg-row.officer{justify-content:flex-end;}
  .msg-bubble{max-width:78%; padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.35; word-break:break-word;}
  .msg-bubble.admin{background:var(--raised); border:1px solid var(--border); border-bottom-left-radius:4px;}
  .msg-bubble.officer{background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#1a1610; border-bottom-right-radius:4px;}

  /* Status console — the one place this screen spends its design boldness */
  .status-console{position:relative; border-radius:18px; padding:20px 20px 18px 22px; margin-bottom:14px; overflow:hidden;
    background:linear-gradient(150deg,var(--surface) 0%,var(--bg) 160%); border:1px solid var(--border); box-shadow:var(--shadow-md);}
  .status-console::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--sc-accent, var(--gold));}
  .status-console .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:var(--sc-accent, var(--gold));}
  .status-console h3{font-family:var(--font-display); font-size:26px; font-weight:600; margin:6px 0 2px;}
  .status-console p{color:var(--muted); font-size:12.5px; margin:0;}
  .status-console .pulse{position:relative; width:11px; height:11px; border-radius:50%; background:var(--sc-accent, var(--gold)); flex-shrink:0;}
  .status-console .pulse::after{content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid var(--sc-accent, var(--gold)); opacity:.7; animation:pulsering 2.2s ease-out infinite;}
  @keyframes pulsering{0%{transform:scale(.5); opacity:.7;} 100%{transform:scale(2); opacity:0;}}
</style>
</head>

// Generic in-memory stand-in for the Supabase query builder — enough of
// select/eq/neq/gte/lte/order/limit/single/maybeSingle/insert/update/delete
// to run this app's existing queries unmodified against demo data.
function makeDemoClient(seed, rpcHandlers){
  rpcHandlers = rpcHandlers || {};
  function newId(){ return "demo-" + Math.random().toString(36).slice(2,10); }
  function matchRow(row, filters){
    return filters.every(f=>{
      const v = row[f.col];
      switch(f.op){
        case "eq": return v === f.val;
        case "neq": return v !== f.val;
        case "gte": return v >= f.val;
        case "lte": return v <= f.val;
        default: return true;
      }
    });
  }
  function table(name){
    let filters = [], orderCol = null, orderAsc = true, limitN = null;
    let wantSingle = false, wantMaybeSingle = false;
    let insertPayload = null, updatePayload = null, wantDelete = false;
    const q = {
      select(){ return q; },
      eq(c,v){ filters.push({col:c,op:"eq",val:v}); return q; },
      neq(c,v){ filters.push({col:c,op:"neq",val:v}); return q; },
      gte(c,v){ filters.push({col:c,op:"gte",val:v}); return q; },
      lte(c,v){ filters.push({col:c,op:"lte",val:v}); return q; },
      order(c,opts){ orderCol=c; orderAsc = !(opts && opts.ascending===false); return q; },
      limit(n){ limitN=n; return q; },
      single(){ wantSingle=true; return q; },
      maybeSingle(){ wantMaybeSingle=true; return q; },
      insert(payload){ insertPayload=payload; return q; },
      update(payload){ updatePayload=payload; return q; },
      delete(){ wantDelete=true; return q; },
      then(resolve){ resolve(run()); },
    };
    function run(){
      if(!seed[name]) seed[name] = [];
      const arr = seed[name];
      if(insertPayload){
        const rows = (Array.isArray(insertPayload) ? insertPayload : [insertPayload]).map(r=>({id:newId(), ...r}));
        arr.push(...rows);
        return {data: wantSingle ? rows[0] : rows, error:null};
      }
      if(updatePayload){
        const matched = arr.filter(r=>matchRow(r, filters));
        matched.forEach(r=>Object.assign(r, updatePayload));
        return {data: matched, error:null};
      }
      if(wantDelete){
        seed[name] = arr.filter(r=>!matchRow(r, filters));
        return {data:null, error:null};
      }
      let rows = arr.filter(r=>matchRow(r, filters));
      if(orderCol){
        rows = rows.slice().sort((a,b)=>{
          const av=a[orderCol], bv=b[orderCol];
          if(av===bv) return 0;
          return (av>bv ? 1 : -1) * (orderAsc ? 1 : -1);
        });
      }
      if(limitN!=null) rows = rows.slice(0, limitN);
      if(wantSingle) return rows.length ? {data:rows[0], error:null} : {data:null, error:{message:"No rows found"}};
      if(wantMaybeSingle) return {data: rows[0] || null, error:null};
      return {data: rows, error:null};
    }
    return q;
  }
  return {
    from(name){ return table(name); },
    rpc(name, params){
      return { then(resolve){
        const handler = rpcHandlers[name];
        resolve(handler ? handler(params, seed) : {data:null, error:{message:`Demo mode: ${name} not implemented`}});
      }};
    },
    storage: {
      from(){
        return {
          upload: async ()=> ({data:{path:"demo"}, error:null}),
          createSignedUrl: async (path)=> ({data:{signedUrl: path}, error:null}),
        };
      }
    }
  };
}

const DEMO_RPC = {
  verify_officer_pin(params, seed){
    if(params.p_pin !== DEMO_PIN) return {data:null, error:{message:"Invalid PIN"}};
    const o = seed.officers.find(x=>x.callsign===params.p_callsign);
    if(!o) return {data:null, error:{message:"Not found"}};
    return {data:{id:o.id, name:o.name, callsign:o.callsign, photo_url:null}, error:null};
  },
  officer_clock_in(params, seed){
    const o = seed.officers.find(x=>x.id===params.p_officer_id);
    if(o){ o.status="on_duty"; o.site_id=params.p_site_id; o.status_changed_at=new Date().toISOString(); }
    const shift = {id:"demo-shift-"+Date.now(), officer_id:params.p_officer_id, site_id:params.p_site_id, clock_in_at:new Date().toISOString(), clock_out_at:null, starts_at:new Date().toISOString()};
    seed.shifts.push(shift);
    return {data:shift, error:null};
  },
  officer_clock_out(params, seed){
    const shift = seed.shifts.find(s=>s.id===params.p_shift_id) || seed.shifts.find(s=>s.officer_id===params.p_officer_id && !s.clock_out_at);
    if(shift) shift.clock_out_at = new Date().toISOString();
    const o = seed.officers.find(x=>x.id===params.p_officer_id);
    if(o){ o.status="off_duty"; o.status_changed_at=new Date().toISOString(); }
    return {data:{ok:true}, error:null};
  },
  officer_ping(params, seed){
    seed.location_pings.unshift({id:"demo-ping-"+Date.now(), officer_id:params.p_officer_id, lat:params.p_lat, lng:params.p_lng, recorded_at:new Date().toISOString()});
    return {data:{ok:true}, error:null};
  },
  officer_set_status(params, seed){
    const o = seed.officers.find(x=>x.id===params.p_officer_id);
    if(o){ o.status = params.p_status; o.status_changed_at = new Date().toISOString(); }
    return {data:{ok:true}, error:null};
  },
  officer_switch_site(params, seed){
    const o = seed.officers.find(x=>x.id===params.p_officer_id);
    if(o) o.site_id = params.p_site_id;
    return {data:{ok:true}, error:null};
  },
  officer_scan_checkpoint(params, seed){
    seed.checkpoint_scans.push({id:"demo-scan-"+Date.now(), patrol_id:params.p_patrol_id, officer_id:params.p_officer_id, checkpoint_id:params.p_checkpoint_id, scanned_at:new Date().toISOString(), verified:true, lat:params.p_lat, lng:params.p_lng, photo_url:params.p_photo_url||null});
    return {data:{verified:true}, error:null};
  },
  officer_manual_checkpoint(params, seed){
    seed.checkpoint_scans.push({id:"demo-scan-"+Date.now(), patrol_id:params.p_patrol_id, officer_id:params.p_officer_id, checkpoint_id:params.p_checkpoint_id, scanned_at:new Date().toISOString(), verified:true, lat:params.p_lat, lng:params.p_lng, photo_url:null});
    return {data:{verified:true}, error:null};
  },
  officer_submit_incident(params, seed){
    seed.incidents.unshift({id:"demo-incident-"+Date.now(), site_id:params.p_site_id, officer_id:params.p_officer_id, title:params.p_title, category:params.p_category, severity:params.p_severity, status:"open", description:params.p_description, occurred_at:new Date().toISOString(), lat:params.p_lat, lng:params.p_lng, photo_urls:params.p_photo_urls||[]});
    return {data:{ok:true}, error:null};
  },
  officer_submit_patrol_report(params, seed){
    seed.patrol_reports.unshift({id:"demo-report-"+Date.now(), site_id:params.p_site_id, officer_id:params.p_officer_id, patrol_type:params.p_patrol_type, started_at:params.p_started_at, ended_at:new Date().toISOString(), areas_patrolled:params.p_areas_patrolled, details:params.p_details, activity_types:params.p_activity_types||[], media_urls:params.p_media_urls||[]});
    return {data:{ok:true}, error:null};
  },
  officer_send_message(params, seed){
    seed.messages.push({id:"demo-msg-"+Date.now(), officer_id:params.p_officer_id, sender:"officer", body:params.p_body, is_priority:false, created_at:new Date().toISOString()});
    return {data:{ok:true}, error:null};
  },
  officer_send_priority_message(params, seed){
    seed.messages.push({id:"demo-msg-"+Date.now(), officer_id:params.p_officer_id, sender:"officer", body:params.p_body, is_priority:true, created_at:new Date().toISOString()});
    return {data:{ok:true}, error:null};
  },
};

  pin: null,           // kept in memory only, re-sent per write for verification
  site: null,
  shift: null,
  patrol: null,

};

function loadSession(){
  const raw = sessionStorage.getItem("lp_session");
  if(!raw) return;
  try{
    const s = JSON.parse(raw);
    state.officer = s.officer; state.pin = s.pin; state.site = s.site; state.shift = s.shift;
  }catch(e){}
}
function saveSession(){
  sessionStorage.setItem("lp_session", JSON.stringify({
    officer: state.officer, pin: state.pin, site: state.site, shift: state.shift
  }));
}
function clearSession(){
  sessionStorage.removeItem("lp_session");
  state = {officer:null, pin:null, site:null, shift:null, patrol:null, checkpoints:[], scans:[], watchId:null};
}

function toast(msg, kind="default"){
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

async function sendShiftReportEmail(clockInAt, site, finalNote){
  if(DEMO_MODE){
    console.log("Demo mode — skipping real shift report email.");
    return;
  }
  if(!window.emailjs || EMAILJS_PUBLIC_KEY === "YOUR_EMAILJS_PUBLIC_KEY"){
    console.warn("EmailJS not configured yet — skipping shift report email.");
    return;
  }
  try{
    const clockOutAt = new Date().toISOString();
    const fmt = (iso)=> new Date(iso).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
    const esc = (s)=> String(s ?? "").replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

    const [scansRes, incidentsRes, reportsRes, checkpointsRes] = await Promise.all([
      sb.from("checkpoint_scans").select("*").eq("officer_id", state.officer.id).gte("scanned_at", clockInAt).lte("scanned_at", clockOutAt),
      sb.from("incidents").select("*").eq("officer_id", state.officer.id).gte("occurred_at", clockInAt).lte("occurred_at", clockOutAt),
      sb.from("patrol_reports").select("*").eq("officer_id", state.officer.id).gte("started_at", clockInAt).lte("ended_at", clockOutAt),
      sb.from("checkpoints").select("*").eq("site_id", site?.id || ""),
    ]);
    const scans = scansRes.data || [];
    const incidents = incidentsRes.data || [];
    const reports = reportsRes.data || [];
    const cpById = {};
    (checkpointsRes.data||[]).forEach(c=>{ cpById[c.id] = c; });

    const signedUrlCache = {};
    async function getSignedMediaUrl(path){
      if(!path) return null;
      if(signedUrlCache[path]) return signedUrlCache[path];
      const {data, error} = await sb.storage.from(STORAGE_BUCKET).createSignedUrl(path, 60*60*24*365*10); // 10 years — effectively permanent
      if(error || !data) return null;
      signedUrlCache[path] = data.signedUrl;
      return data.signedUrl;
    }
    async function mediaLinksHtml(paths){
      if(!paths || !paths.length) return "";
      const links = [];
      let photoNum = 0, videoNum = 0;
      for(const path of paths){
        const url = await getSignedMediaUrl(path);
        if(!url) continue;
        const isVideo = /\.(mp4|mov|webm|m4v)$/i.test(path);
        const label = isVideo ? `View Video ${++videoNum}` : `View Photo ${++photoNum}`;
        links.push(`<a href="${url}" style="display:inline-block; font-size:11px; font-weight:600; color:#8a6a1f; background:#f5ecd6; border-radius:5px; padding:5px 10px; margin:6px 6px 0 0; text-decoration:none;">${label} &rarr;</a>`);
      }
      return links.length ? `<div>${links.join("")}</div>` : "";
    }

    const sectionHeading = (label, count)=>
      `<div style="color:#8a6a1f; font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid #eeece5;">${label} <span style="color:#a8a69c; font-weight:500;">(${count})</span></div>`;
    const emptyRow = (label)=>
      `<div style="color:#a8a69c; font-size:13px; font-style:italic; padding:2px 0 4px;">No ${label} logged this shift.</div>`;
    const card = (accentColor, innerHtml)=>
      `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:10px; background:#faf9f6; border:1px solid #eeece5; border-left:3px solid ${accentColor}; border-radius:0 6px 6px 0;">
        <tr><td style="padding:12px 16px;">${innerHtml}</td></tr>
      </table>`;
    const titleRow = (leftHtml, rightHtml)=>
      `<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
        <td style="font-size:13px; font-weight:700; color:#1a1a17;">${leftHtml}</td>
        <td style="text-align:right; white-space:nowrap; padding-left:10px;">${rightHtml}</td>
      </tr></table>`;
    const badge = (text, color, bg)=>
      `<span style="display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:${color}; background:${bg}; border-radius:4px; padding:3px 8px;">${text}</span>`;

    let summary = "";

    if(finalNote){
      summary += `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:16px; background:#faf9f6; border:1px solid #eeece5; border-left:3px solid #b8933f; border-radius:0 6px 6px 0;">
        <tr><td style="padding:12px 16px;">
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:#8a6a1f; margin-bottom:4px;">Final Note</div>
          <div style="color:#2a2a26; font-size:13px; line-height:1.5;">${esc(finalNote)}</div>
        </td></tr>
      </table>`;
    }

    summary += sectionHeading("Checkpoint Scans", scans.length);
    if(scans.length){
      summary += `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:6px;">`;
      summary += scans.map(s=>{
        const cp = cpById[s.checkpoint_id];
        const b = s.verified ? badge("Verified", "#3f7350", "#e6f0e8") : badge("Flagged", "#8a6a1f", "#f5ecd6");
        return `<tr style="border-bottom:1px solid #eeece5;">
          <td style="padding:9px 0; font-size:13px; color:#2a2a26;">${fmt(s.scanned_at)} &mdash; ${esc(cp?.name || "Unknown checkpoint")}</td>
          <td style="padding:9px 0; text-align:right; white-space:nowrap;">${b}</td>
        </tr>`;
      }).join("");
      summary += `</table>`;
    } else {
      summary += emptyRow("checkpoint scans");
    }

    summary += sectionHeading("Patrol Reports", reports.length);
    if(reports.length){
      for(const r of reports){
        const tags = (r.activity_types||[]).map(a=>`<span style="display:inline-block; background:#f2e9d3; color:#7a5c1e; font-size:10px; font-weight:700; border-radius:4px; padding:3px 8px; margin:6px 6px 0 0;">${esc(a)}</span>`).join("");
        const mediaLinks = await mediaLinksHtml(r.media_urls);
        summary += card("#b8933f", `
          ${titleRow(`${esc(r.patrol_type.charAt(0).toUpperCase()+r.patrol_type.slice(1))} Patrol`, `<span style="color:#8a887e; font-size:12px; font-weight:400;">${fmt(r.ended_at)}</span>`)}
          <div style="color:#6b6a63; font-size:12px; margin-top:3px;">${esc(r.areas_patrolled) || "No area noted"}</div>
          ${tags}
          ${r.details ? `<div style="color:#2a2a26; font-size:12px; margin-top:8px; line-height:1.5;">${esc(r.details)}</div>` : ""}
          ${mediaLinks}
        `);
      }
    } else {
      summary += emptyRow("patrol reports");
    }

    summary += sectionHeading("Incidents", incidents.length);
    if(incidents.length){
      for(const i of incidents){
        const sevMap = { high: ["#a23c30","#f7e2df"], medium: ["#8a6a1f","#f5ecd6"], low: ["#6b6a63","#eeece5"] };
        const [sevColor, sevBg] = sevMap[i.severity] || sevMap.low;
        const mediaLinks = await mediaLinksHtml(i.photo_urls);
        summary += card(sevColor, `
          ${titleRow(esc(i.title), badge(i.severity, sevColor, sevBg))}
          <div style="color:#8a887e; font-size:12px; margin-top:3px;">${fmt(i.occurred_at)} &mdash; ${esc(i.category.charAt(0).toUpperCase()+i.category.slice(1))}</div>

    } else {

    }

      to_email: SHIFT_REPORT_EMAIL,
      officer_name: state.officer.name,
      callsign: state.officer.callsign,

function getLocation(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve({lat:null,lng:null}); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat:pos.coords.latitude, lng:pos.coords.longitude}),
      err => resolve({lat:null, lng:null}),
      {enableHighAccuracy:true, timeout:8000}
    );
  });
}

function startLocationPings(){
  if(!navigator.geolocation) return;
  state.watchId = navigator.geolocation.watchPosition(async (pos)=>{
    if(!state.officer || !state.shift) return;
    await callOrQueue("ping", {
      p_officer_id: state.officer.id, p_pin: state.pin, p_shift_id: state.shift.id,
      p_lat: pos.coords.latitude, p_lng: pos.coords.longitude
    });
  }, ()=>{}, {enableHighAccuracy:true, maximumAge:60000});
}
function stopLocationPings(){
  if(state.watchId!=null && navigator.geolocation) navigator.geolocation.clearWatch(state.watchId);
  state.watchId = null;
}

// Camera / QR scanner lifecycle — the single source of truth
// for whether a camera is running, so it can always be killed
// from anywhere: back button, tab hidden, page closing.
// =========================================================
let activeScanner = null;   // Html5Qrcode instance, if one is running
let scannerRunning = false;

async function stopActiveScanner(){
  if(!activeScanner){ return; }
  const s = activeScanner;
  activeScanner = null;
  if(scannerRunning){
    scannerRunning = false;
    try{ await s.stop(); }catch(e){}
  }
  try{ s.clear(); }catch(e){}
  // Safety net: iOS Safari has known cases where stop() doesn't fully
  // release the hardware — directly kill any leftover video tracks too
  document.querySelectorAll("#qr-reader video").forEach(v=>{
    if(v.srcObject){
      try{ v.srcObject.getTracks().forEach(t=>t.stop()); }catch(e){}
      v.srcObject = null;
    }
  });
  const reader = document.getElementById("qr-reader");
  if(reader) reader.style.display = "none";
  const torchBtn = document.getElementById("torchBtn");
  if(torchBtn) torchBtn.remove();
}

// Registered once — kills the camera the instant the tab is hidden,
// backgrounded, or the page is closing, regardless of what screen
// the app thinks it's on
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopActiveScanner(); });
window.addEventListener("pagehide", stopActiveScanner);
window.addEventListener("beforeunload", stopActiveScanner);

// =========================================================
// Offline queue — the durable local store for every write
// that must survive a dead zone. Persists in localStorage,
// so it survives app restarts and phone reboots as long as
// the officer doesn't clear Safari's site data.
//
// Scope, on purpose: scans, incidents, patrol reports, status
// changes, and messages are queueable. Login, clock in/out,
// switching sites, and starting a brand-new patrol still need
// a live connection — those are the moments that need a real
// server response before the app can meaningfully continue.
// =========================================================
const QUEUE_KEY = "lp_offline_queue";
const FAILED_KEY = "lp_offline_failed";
const LAST_SYNC_KEY = "lp_last_sync_at";

function loadQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); }catch(e){ return []; } }
function saveQueue(q){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){ console.error("Queue save failed:", e); } }
function loadFailed(){ try{ return JSON.parse(localStorage.getItem(FAILED_KEY) || "[]"); }catch(e){ return []; } }
function saveFailed(f){ try{ localStorage.setItem(FAILED_KEY, JSON.stringify(f)); }catch(e){} }
function markSynced(){ localStorage.setItem(LAST_SYNC_KEY, new Date().toISOString()); }
function lastSyncAt(){ return localStorage.getItem(LAST_SYNC_KEY); }

function newQueueId(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now()+"-"+Math.random().toString(36).slice(2));
}

// Each handler performs the real Supabase call for a queued item's type.
// Every one of these mirrors an existing direct call elsewhere in the app —
// nothing new is invented here, this just gives queued items a way to replay.
const QUEUE_HANDLERS = {
  ping: (p)=> sb.rpc("officer_ping", p),
  status: (p)=> sb.rpc("officer_set_status", p),
  checkpoint_scan: (p)=> sb.rpc("officer_scan_checkpoint", p),
  manual_checkpoint: (p)=> sb.rpc("officer_manual_checkpoint", p),
  incident: (p)=> sb.rpc("officer_submit_incident", p),
  patrol_report: (p)=> sb.rpc("officer_submit_patrol_report", p),
  complete_patrol: (p)=> sb.from("patrols").update({status:"completed", completed_at:p.completed_at}).eq("id", p.patrol_id),
  message: (p)=> sb.rpc("officer_send_message", p),
  priority_message: (p)=> sb.rpc("officer_send_priority_message", p),
};

const QUEUE_LABEL = {
  ping: "Location update", status: "Status change", checkpoint_scan: "Checkpoint scan",
  manual_checkpoint: "Manual checkpoint mark", incident: "Incident report", patrol_report: "Patrol report",
  complete_patrol: "Round completion", message: "Message", priority_message: "Assistance request",
};

function enqueue(type, payload){
  const q = loadQueue();
  q.push({id:newQueueId(), type, payload, createdAt:new Date().toISOString()});
  saveQueue(q);
  updateSyncPill();
}

// The single entry point every write in this app goes through. Tries the
// real call first; if the network genuinely isn't there, it queues instead
// of failing. If the SERVER responds (even with a rejection), that's not a
// connectivity problem — it's surfaced immediately, not queued, because
// retrying a rejected action later would just fail again silently.
async function callOrQueue(type, payload){
  if(!navigator.onLine){
    enqueue(type, payload);
    return {queued:true};
  }
  try{
    const result = await QUEUE_HANDLERS[type](payload);
    if(!result.error){
      markSynced();
      flushQueue(); // catch up any older backlog now that we know we're online
    }
    return result;
  }catch(e){
    // A thrown exception here means the fetch itself never reached the
    // server — that's a connectivity failure, not an application error
    enqueue(type, payload);
    return {queued:true};
  }
}

let flushing = false;
async function flushQueue(){
  if(flushing) return;
  flushing = true;
  try{
    let q = loadQueue();
    while(q.length){
      const item = q[0];
      const handler = QUEUE_HANDLERS[item.type];
      if(!handler){ q.shift(); saveQueue(q); q = loadQueue(); continue; }
      let result;
      try{
        result = await handler(item.payload);
      }catch(e){
        break; // still offline — stop here, the rest stays queued for next try
      }
      if(result.error){
        // Server reached us and rejected it — move to the failed list instead
        // of silently dropping it, so the officer can see and act on it
        const failed = loadFailed();
        failed.push({...item, failedAt:new Date().toISOString(), reason: result.error.message || "Rejected by server"});
        saveFailed(failed);
      }
      q.shift();
      saveQueue(q);
      q = loadQueue();
    }
    if(loadQueue().length === 0) markSynced();
  } finally {
    flushing = false;
    updateSyncPill();
  }
}

function updateSyncPill(){
  const pill = document.getElementById("syncPill");
  if(!pill) return;
  const pending = loadQueue().length;
  const failed = loadFailed().length;
  if(pending > 0){
    pill.textContent = `Offline — ${pending} pending`;
    pill.className = "sync-pill warn";
  } else if(failed > 0){
    pill.textContent = `${failed} item${failed===1?"":"s"} failed to sync`;
    pill.className = "sync-pill danger";
  } else {
    const ts = lastSyncAt();
    const t = ts ? timeInState(ts) : null;
    pill.textContent = !t ? "Synced" : t === "just now" ? "Synced just now" : `Synced ${t} ago`;
    pill.className = "sync-pill ok";
  }
}

setInterval(flushQueue, 20000);
window.addEventListener("online", flushQueue);

function timeInState(since){
  const mins = Math.floor((Date.now() - new Date(since).getTime())/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return `${mins}m`;
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}h ${m}m`;
}

function avatarStyle(name){
  let hash = 0;
  for(let i=0; i<name.length; i++){ hash = name.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return `background:linear-gradient(135deg, hsl(${hue} 70% 48%), hsl(${(hue+45)%360} 65% 30%));`;
}
function initialsOf(name){
  return (name||"").split(" ").map(x=>x[0]).filter(Boolean).slice(0,2).join("").toUpperCase();
}

    document.getElementById("delPin").onclick = ()=>{ pin = pin.slice(0,-1); draw(); };
    document.getElementById("loginBtn").onclick = doLogin;
  }

  async function doLogin(){
    const officer = (officers||[]).find(o=>o.id===selected);
    if(!officer) return;
    document.getElementById("loginErr").textContent = "";

        p_lat: loc.lat, p_lng: loc.lng
      });
      if(error){ document.getElementById("homeErr").textContent = "Couldn't clock in — try again."; btn.disabled=false; btn.textContent="Clock In"; return; }
      state.shift = data;
      state.site = (sites||[]).find(s=>s.id===sel.value);
      saveSession();
      startLocationPings();
      vibrate(60);
      toast("Clocked in", "success");
      renderHome();
    };
  } else {
    document.getElementById("statusBanner").onclick = renderChangeStatus;
    document.getElementById("btnPatrol").onclick = renderPatrol;
    document.getElementById("btnIncident").onclick = renderIncident;
    document.getElementById("switchSiteLink").onclick = renderSwitchSite;
    document.getElementById("logPatrolLink").onclick = renderLogPatrol;

    document.getElementById("btnAssist").onclick = async ()=>{
      if(!confirm("Send an emergency assistance request to Command? Your location will be shared.")) return;
      const btn = document.getElementById("btnAssist");
      btn.disabled = true; btn.textContent = "Sending…";
      const loc = await getLocation();
      const mapsLink = (loc.lat && loc.lng) ? `https://maps.google.com/?q=${loc.lat},${loc.lng}` : "location unavailable";
      const body = `NEED ASSISTANCE — ${state.officer.name} at ${state.site?.name || "unknown site"}. Location: ${mapsLink}`;
      const result = await callOrQueue("priority_message", {p_officer_id: state.officer.id, p_pin: state.pin, p_body: body});
      if(result.error){ toast("Couldn't send — try again or call directly.", "danger"); btn.disabled=false; btn.textContent="Need Assistance"; return; }
      vibrate([100,60,100,60,100]);
      if(result.queued){
        toast("No signal — request queued, will send the instant you're back in range. Call 911 if this is an emergency.", "danger");
      } else {
        toast("Assistance request sent to Command", "success");
      }
      btn.disabled = false; btn.textContent = "Need Assistance";
    };

    document.getElementById("clockOutBtn").onclick = renderEndShiftSummary;
  }

  document.getElementById("signOutLink").onclick = ()=>{
    stopLocationPings();
    clearSession();
    renderLogin();
  };

  document.getElementById("tileMessages").onclick = renderMessages;

  if(onDuty){
    updateSyncPill();
    const issuesLink = document.getElementById("syncIssuesLink");
    if(issuesLink) issuesLink.onclick = renderSyncIssues;
  }
}

async function renderPatrol(){
  const {data: checkpoints} = await sb.from("checkpoints").select("*").eq("site_id", state.site.id).order("seq");
  let {data: activePatrol} = await sb.from("patrols").select("*")
    .eq("site_id", state.site.id).eq("officer_id", state.officer.id).eq("status","active").maybeSingle();

  if(!activePatrol){
    const {data: created, error: createErr} = await sb.from("patrols").insert({
      site_id: state.site.id, officer_id: state.officer.id, name:"Patrol", status:"active", started_at:new Date().toISOString()
    }).select().single();
    if(createErr || !created){
      toast("Couldn't start patrol — try again.", "danger");
      console.error("Patrol creation failed:", createErr);
      return;
    }
    activePatrol = created;
  }
  state.patrol = activePatrol;
  await setOfficerStatus("on_patrol");

  const {data: scans} = await sb.from("checkpoint_scans").select("*").eq("patrol_id", state.patrol.id);
  state.scans = scans || [];

  function scanStatusFor(cpId){
    const s = state.scans.find(s=>s.checkpoint_id===cpId);
    if(s) return s.verified ? "done" : "unverified";
    if(state.locallyMarked && state.locallyMarked.has(cpId)) return "queued";
    return "pending";
  }

  const total = (checkpoints||[]).length;
  const done = (checkpoints||[]).filter(cp=>scanStatusFor(cp.id)!=="pending").length;
  const nextPending = (checkpoints||[]).find(cp=>scanStatusFor(cp.id)==="pending");

  app.innerHTML = `
    <div class="screen">
      <div class="backbar" id="backBtn">‹ Back</div>
      <h1>${state.site.name} — Checkpoints</h1>
      <p class="sub">${total ? `${done} of ${total} checked` : "No checkpoints set up for this site."}</p>
      <div id="qr-reader" style="display:none; margin-bottom:16px;"></div>
      <button class="btn btn-primary" id="startScanBtn" ${!nextPending ? "disabled" : ""}>${icons.qr} Scan Next Checkpoint</button>
      <div class="card" style="margin-top:18px;">
        ${(checkpoints||[]).map(cp=>{
          const st = scanStatusFor(cp.id);
          const label = st==="pending" ? "Pending" : st==="done" ? "Verified" : st==="queued" ? "Saved — syncing" : "Too far";
          return `<div class="checkpoint-row">
            <span>${cp.seq}. ${cp.name}</span>
            <span style="display:flex; align-items:center; gap:8px;">
              ${st==="pending" ? `<span class="subtle-link" data-manual="${cp.id}" style="font-size:11px; color:var(--muted);">Can't scan?</span>` : ""}
              <span class="cp-status ${st}">${label}</span>
            </span>
          </div>`;
        }).join("")}
      </div>
      <button class="btn btn-secondary" id="allClearBtn" style="margin-top:14px;">Round Complete — All Clear</button>
    </div>`;

  document.getElementById("backBtn").onclick = async ()=>{
    await stopActiveScanner();
    renderHome();
  };
  document.getElementById("startScanBtn").onclick = ()=>startQrScan(checkpoints||[]);
  document.querySelectorAll("[data-manual]").forEach(el=>{
    el.onclick = ()=> renderManualCheckpoint(el.dataset.manual, checkpoints||[]);
  });
  document.getElementById("allClearBtn").onclick = ()=> confirmAllClear(checkpoints||[]);
}

async function confirmAllClear(checkpoints){

    p_patrol_type: "foot", p_started_at: state.patrol.started_at,
    p_areas_patrolled: `All ${checkpoints.length} checkpoint${checkpoints.length===1?"":"s"}`,
    p_details: "Round completed — all clear, nothing to report.",
    p_activity_types: ["Nothing to report"], p_media_urls: []
  });

  vibrate(80);

}

function startQrScan(checkpoints){
  const reader = document.getElementById("qr-reader");
  reader.style.display = "block";
  const qr = new Html5Qrcode("qr-reader");
  activeScanner = qr;
  let handled = false;

  qr.start({facingMode:"environment"}, {fps:10, qrbox:220}, async (decodedText)=>{
    if(handled) return;
    const cp = checkpoints.find(c=>c.qr_token===decodedText.trim());
    if(!cp){ toast("Unrecognized checkpoint code", "danger"); return; }
    handled = true;
    await stopActiveScanner();
    vibrate(60);

    const loc = await getLocation();
    const result = await callOrQueue("checkpoint_scan", {
      p_officer_id: state.officer.id, p_pin: state.pin, p_patrol_id: state.patrol.id,
      p_checkpoint_id: cp.id, p_lat: loc.lat, p_lng: loc.lng, p_photo_url: null
    });
    if(result.error){ vibrate([40,60,40]); toast("Scan failed — try again.", "danger"); }
    else if(result.queued){
      state.locallyMarked = state.locallyMarked || new Set();
      state.locallyMarked.add(cp.id);
      vibrate(60);
      toast(`${cp.name} saved offline — will verify once synced`, "danger");
    }
    else if(result.data.verified){ vibrate(80); toast(`${cp.name} verified ✓`, "success"); }
    else { vibrate([40,60,40]); toast(`${cp.name} scanned, but you're too far from the checkpoint`, "danger"); }
    renderPatrol();
  }, ()=>{}).then(()=>{
    scannerRunning = true;
    showTorchToggle(qr);
  }).catch(()=>{
    activeScanner = null;
    toast("Couldn't access camera — check permissions.", "danger");
    reader.style.display = "none";
  });
}

function showTorchToggle(qr){
  const existing = document.getElementById("torchBtn");
  if(existing) existing.remove();
  const btn = document.createElement("button");
  btn.id = "torchBtn";
  btn.className = "btn btn-secondary";
  btn.style.marginTop = "10px";
  btn.textContent = "Flashlight";
  btn.onclick = async ()=>{
    try{
      const caps = qr.getRunningTrackCapabilities ? qr.getRunningTrackCapabilities() : {};
      if(!caps || !caps.torch){ toast("Flashlight not supported on this device", "danger"); return; }
      const isOn = btn.dataset.on === "1";
      await qr.applyVideoConstraints({advanced:[{torch: !isOn}]});
      btn.dataset.on = isOn ? "0" : "1";
      btn.textContent = isOn ? "Flashlight" : "Flashlight: On";
    }catch(e){
      toast("Flashlight not supported on this device", "danger");
    }
  };
  document.getElementById("qr-reader").insertAdjacentElement("afterend", btn);
}

const PATROL_ACTIVITY_TYPES = ["Nothing to report","Suspicious activity","Trespasser","Unlocked/broken door","Equipment issue","Lighting issue","Vehicle in lot","Other"];

async function renderLogPatrol(){
  let patrolType = "foot", areas = "", details = "", activityTypes = [], mediaFiles = [];
  const startedAt = new Date().toISOString();

  function draw(){
    app.innerHTML = `
      <div class="screen">
        <div class="backbar" id="backBtn">‹ Home</div>
        <h1>Log Patrol</h1>
        <p class="sub">${state.site.name}</p>

        <label>Patrol Type</label>
        <div class="chip-row" id="typeRow">
          ${["foot","vehicle","checkpoint"].map(t=>`<div class="chip ${patrolType===t?"active":""}" data-t="${t}">${t}</div>`).join("")}
        </div>

        <label>Area(s) Patrolled</label>
        <input type="text" id="areasInput" placeholder="Loading dock, north perimeter…" value="${areas}" />

        <label>Details</label>
        <textarea id="detailsInput" placeholder="What did you observe?">${details}</textarea>

        <label>Activity Types</label>
        <div class="chip-row" id="activityRow">
          ${PATROL_ACTIVITY_TYPES.map(a=>`<div class="chip ${activityTypes.includes(a)?"active":""}" data-a="${a}">${a}</div>`).join("")}
        </div>

        <label>Photos / Video</label>
        <input type="file" id="mediaInput" accept="image/*,video/*" multiple />
        ${mediaFiles.length ? `<div class="chip-row">${mediaFiles.map((f,i)=>`<div class="chip">${f.name.length>18?f.name.slice(0,15)+"…":f.name} <span data-removemedia="${i}" style="margin-left:6px; cursor:pointer;">✕</span></div>`).join("")}</div>` : ""}

        <div class="err" id="patrolErr"></div>
        <button class="btn btn-primary" id="patrolSubmitBtn" style="margin-top:18px;">Save Patrol Report</button>
      </div>`;

    document.getElementById("backBtn").onclick = renderHome;
    document.querySelectorAll("#typeRow .chip").forEach(c=>c.onclick=()=>{patrolType=c.dataset.t; draw();});
    document.querySelectorAll("#activityRow .chip").forEach(c=>c.onclick=()=>{
      const a = c.dataset.a;
      activityTypes = activityTypes.includes(a) ? activityTypes.filter(x=>x!==a) : [...activityTypes, a];
      draw();
    });
    document.getElementById("areasInput").oninput = (e)=>{ areas = e.target.value; };
    document.getElementById("detailsInput").oninput = (e)=>{ details = e.target.value; };
    document.getElementById("mediaInput").onchange = (e)=>{
      mediaFiles = [...mediaFiles, ...Array.from(e.target.files)];
      draw();
    };
    document.querySelectorAll("[data-removemedia]").forEach(x=>{
      x.onclick = (e)=>{ e.stopPropagation(); mediaFiles.splice(parseInt(x.dataset.removemedia),1); draw(); };
    });
    document.getElementById("patrolSubmitBtn").onclick = submit;
  }

  async function submit(){
    const btn = document.getElementById("patrolSubmitBtn");
    btn.disabled = true; btn.textContent = "Uploading…";

    const mediaUrls = [];
    let uploadFailCount = 0;
    for(const file of mediaFiles){
      const path = `patrols/${state.officer.id}/${Date.now()}-${file.name}`;
      const {error: upErr} = await sb.storage.from(STORAGE_BUCKET).upload(path, file);
      if(upErr){ uploadFailCount++; console.error("Media upload failed:", upErr); }
      else mediaUrls.push(path);
    }

    btn.textContent = "Saving…";
    const result = await callOrQueue("patrol_report", {
      p_officer_id: state.officer.id, p_pin: state.pin, p_site_id: state.site.id,
      p_patrol_type: patrolType, p_started_at: startedAt, p_areas_patrolled: areas,
      p_details: details, p_activity_types: activityTypes, p_media_urls: mediaUrls
    });

    if(result.error){
      document.getElementById("patrolErr").textContent = "Couldn't save — try again.";
      btn.disabled = false; btn.textContent = "Save Patrol Report";
      return;
    }
    const msg = result.queued
      ? "Saved offline — will sync when back in range" + (uploadFailCount ? `, ${uploadFailCount} file(s) also failed to upload` : "")
      : (uploadFailCount ? `Saved — but ${uploadFailCount} file(s) failed to upload` : "Patrol report saved");
    toast(msg, (result.queued || uploadFailCount) ? "danger" : "success");
    renderHome();
  }

  draw();
}

async function renderEndShiftSummary(){
  const clockInAt = state.shift.clock_in_at;
  const site = state.site;
  const nowIso = new Date().toISOString();
  const durationMins = Math.floor((Date.now() - new Date(clockInAt).getTime())/60000);
  const durationText = durationMins < 60 ? `${durationMins}m` : `${Math.floor(durationMins/60)}h ${durationMins%60}m`;

  const [scansRes, incidentsRes, reportsRes, checkpointsRes] = await Promise.all([
    sb.from("checkpoint_scans").select("verified").eq("officer_id", state.officer.id).gte("scanned_at", clockInAt).lte("scanned_at", nowIso),
    sb.from("incidents").select("title,severity").eq("officer_id", state.officer.id).gte("occurred_at", clockInAt).lte("occurred_at", nowIso),
    sb.from("patrol_reports").select("id").eq("officer_id", state.officer.id).gte("started_at", clockInAt).lte("ended_at", nowIso),
    sb.from("checkpoints").select("id").eq("site_id", site?.id || ""),
  ]);
  const scans = scansRes.data || [];
  const verified = scans.filter(s=>s.verified).length;
  const incidents = incidentsRes.data || [];
  const reportsCount = (reportsRes.data || []).length;

          <span style="color:var(--muted); font-size:13px;">Checkpoints</span>
          <span style="font-size:13px;">${verified} of ${totalCheckpoints || scans.length} verified</span>
        </div>
        <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border);">

        <div style="display:flex; justify-content:space-between; padding:8px 0;">
          <span style="color:var(--muted); font-size:13px;">Incidents</span>
          <span style="font-size:13px;">${incidents.length}</span>
        </div>
        ${incidents.length ? `
          <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
            ${incidents.map(i=>`<div style="font-size:12px; color:var(--muted); padding:2px 0;">• ${i.title} (${i.severity})</div>`).join("")}
          </div>
        ` : ""}
      </div>

      <label>Final Note (optional)</label>
      <textarea id="finalNote" placeholder="Anything Command should know before you go…"></textarea>

      <button class="btn btn-danger" id="confirmEndShiftBtn" style="margin-top:18px;">${icons.logout}Confirm — End Shift</button>
      <button class="btn btn-secondary" id="cancelEndShiftBtn">Cancel</button>
    </div>`;

  document.getElementById("backBtn").onclick = renderHome;
  document.getElementById("cancelEndShiftBtn").onclick = renderHome;

  document.getElementById("confirmEndShiftBtn").onclick = async ()=>{
    const btn = document.getElementById("confirmEndShiftBtn");
    btn.disabled = true; btn.textContent = "Ending shift…";
    const finalNote = document.getElementById("finalNote").value.trim();

    const loc = await getLocation();
    const {error} = await sb.rpc("officer_clock_out", {
      p_officer_id: state.officer.id, p_pin: state.pin, p_shift_id: state.shift.id,
      p_lat: loc.lat, p_lng: loc.lng
    });
    if(error){ toast("Couldn't clock out — try again.", "danger"); btn.disabled=false; btn.textContent="Confirm — End Shift"; return; }

    stopLocationPings();
    state.shift = null; state.site = null;

      .eq("officer_id", state.officer.id).order("created_at", {ascending:true});
    const list = document.getElementById("msgList");
    if(!list) return; // screen navigated away
    list.innerHTML = (msgs||[]).map(m=>`
      <div class="msg-row ${m.sender}">
        <div class="msg-bubble ${m.sender}">${escapeHtmlLocal(m.body)}</div>
      </div>
    `).join("") || `<div class="empty" style="padding:20px 0; text-align:center; color:var(--muted); font-size:13px;">No messages yet</div>`;
    list.scrollTop = list.scrollHeight;
  }

  function escapeHtmlLocal(s){ return String(s).replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }

  app.innerHTML = `
    <div class="screen" style="padding-bottom:12px;">
      <div class="backbar" id="backBtn">‹ Home</div>
      <h1 style="margin-bottom:2px;">Command</h1>
      <p class="sub">Message thread</p>
      <div id="msgList" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px 0;"></div>
      <div class="chip-row" id="quickReplyRow" style="margin-top:10px;">
        ${["On site","Starting round","All clear","En route","Standing by"].map(q=>`<div class="chip" data-quick="${q}">${q}</div>`).join("")}
      </div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <input type="text" id="msgInput" placeholder="Type a message…" style="flex:1;" />
        <button class="btn btn-primary" id="msgSendBtn" style="flex-shrink:0; width:auto; padding:0 18px;">Send</button>
      </div>
    </div>`;

  document.getElementById("backBtn").onclick = ()=>{
    if(messagesPollId){ clearInterval(messagesPollId); messagesPollId = null; }
    renderHome();
  };

  async function sendMsg(body){
    const result = await callOrQueue("message", {p_officer_id: state.officer.id, p_pin: state.pin, p_body: body});
    if(result.error){ toast("Couldn't send — try again.", "danger"); return; }
    vibrate(40);
    if(result.queued){
      // Show it in the thread immediately even though it hasn't synced yet —
      // the data is safely queued either way, this is just so the chat
      // doesn't look like it silently ate the message
      const list = document.getElementById("msgList");
      if(list){
        const row = document.createElement("div");
        row.className = "msg-row officer";
        row.innerHTML = `<div class="msg-bubble officer" style="opacity:.6;">${escapeHtmlLocal(body)}<div style="font-size:10px; margin-top:3px; opacity:.8;">Sending when back in range…</div></div>`;
        list.appendChild(row);
        list.scrollTop = list.scrollHeight;
      }
      return;
    }
    await loadAndDraw();
  }

  document.getElementById("msgSendBtn").onclick = async ()=>{
    const input = document.getElementById("msgInput");
    const body = input.value.trim();
    if(!body) return;
    input.value = "";
    await sendMsg(body);
  };
  document.getElementById("msgInput").onkeydown = (e)=>{
    if(e.key === "Enter") document.getElementById("msgSendBtn").click();
  };
  document.querySelectorAll("[data-quick]").forEach(chip=>{
    chip.onclick = async ()=>{
      chip.style.pointerEvents = "none";
      await sendMsg(chip.dataset.quick);
      chip.style.pointerEvents = "";
    };
  });

  await loadAndDraw();
  messagesPollId = setInterval(loadAndDraw, 5000);
}

async function renderIncident(){
  let category = "general", severity = "low", photoFile = null, photoPreview = null;

  function draw(){
    app.innerHTML = `
      <div class="screen">
        <div class="backbar" id="backBtn">‹ Home</div>
        <h1>Report Incident</h1>
        <p class="sub">${state.site.name}</p>

        <label>Title</label>
        <input type="text" id="title" placeholder="Brief summary" />

        <label>Category</label>
        <div class="chip-row" id="catRow">
          ${["general","access","safety","property","medical"].map(c=>`<div class="chip ${category===c?"active":""}" data-c="${c}">${c}</div>`).join("")}
        </div>

        <label>Severity</label>
        <div class="chip-row" id="sevRow">
          ${["low","medium","high"].map(s=>`<div class="chip ${severity===s?"active":""}" data-s="${s}">${s}</div>`).join("")}
        </div>

        <label>Description</label>
        <textarea id="desc" placeholder="What happened?"></textarea>

        <label>Photo</label>
        <input type="file" id="photoInput" accept="image/*" />
        ${photoPreview ? `<img class="photo-preview" src="${photoPreview}" />` : ""}

        <div class="err" id="incErr"></div>
        <button class="btn btn-primary" id="submitBtn" style="margin-top:18px;">Submit Report</button>
      </div>`;

    document.getElementById("backBtn").onclick = renderHome;
    document.querySelectorAll("#catRow .chip").forEach(c=>c.onclick=()=>{category=c.dataset.c; draw();});
    document.querySelectorAll("#sevRow .chip").forEach(c=>c.onclick=()=>{severity=c.dataset.s; draw();});
    document.getElementById("photoInput").onchange = (e)=>{
      photoFile = e.target.files[0] || null;
      if(photoFile) photoPreview = URL.createObjectURL(photoFile);
      draw();
    };
    document.getElementById("submitBtn").onclick = submit;
  }

  async function submit(){
    const title = document.getElementById("title").value.trim();
    const desc = document.getElementById("desc").value.trim();
    if(!title){ document.getElementById("incErr").textContent = "Title is required."; return; }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = "Submitting…";

    let photoUrls = [];
    let photoUploadFailed = false;
    if(photoFile){
      const path = `incidents/${state.officer.id}/${Date.now()}-${photoFile.name}`;
      const {error: upErr} = await sb.storage.from(STORAGE_BUCKET).upload(path, photoFile);
      if(upErr){ photoUploadFailed = true; console.error("Photo upload failed:", upErr); }
      else photoUrls = [path];
    }

    const loc = await getLocation();
    const result = await callOrQueue("incident", {
      p_officer_id: state.officer.id, p_pin: state.pin, p_site_id: state.site.id,
      p_title: title, p_category: category, p_severity: severity, p_description: desc,
      p_lat: loc.lat, p_lng: loc.lng, p_photo_urls: photoUrls
    });

    if(result.error){
      document.getElementById("incErr").textContent = "Couldn't submit — try again.";
      btn.disabled = false; btn.textContent = "Submit Report";
      return;
    }
    const msg = result.queued
      ? "Saved offline — will sync when back in range" + (photoUploadFailed ? ", photo also failed to upload" : "")
      : (photoUploadFailed ? "Report submitted — but the photo failed to upload" : "Incident report submitted");
    toast(msg, (result.queued || photoUploadFailed) ? "danger" : "success");
    renderHome();
  }

  draw();
}

// =========================================================
// Boot
// =========================================================
loadSession();
if(state.officer && state.shift) startLocationPings();
if(state.officer) renderHome(); else renderLogin();
</script>
