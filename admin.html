<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lion Command</title>
<meta name="theme-color" content="#0a0b0a" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0a0b0a; --surface:#121412; --raised:#1a1c1a;
    --fg:#eceae3; --muted:#8d8b82; --faint:#5e5d57;
    --accent:#d8d2c4; --accent-fg:#0a0b0a;
    --success:#7d9a7e; --warning:#b9a06a; --danger:#b07064;
    --border:#262826; --ring:#d8d2c4;
    --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:22px; --r-2xl:28px;
    --font-display:"Cormorant Garamond","Times New Roman",serif;
    --font-sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family:var(--font-sans);}
  a{color:inherit;}
  .app{min-height:100dvh;}

  /* ---- Sidebar (desktop) ---- */
  .sidebar{position:fixed; inset:0 auto 0 0; z-index:30; width:236px; display:none; flex-direction:column;
    border-right:1px solid var(--border); background:var(--surface); padding:22px 14px;}
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px; margin-bottom:30px;}
  .brand svg{width:30px; height:30px; color:var(--accent);}
  .brand .l{font-family:var(--font-display); font-size:23px; line-height:1; font-weight:600;}
  .brand .s{font-size:10px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; margin-top:3px;}
  .navlist{display:flex; flex-direction:column; gap:2px;}
  .navlink{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--r-md);
    font-size:14px; color:var(--muted); cursor:pointer; border:none; background:none; text-align:left; width:100%;
    font-family:inherit;}
  .navlink svg{width:16px; height:16px; flex-shrink:0;}
  .navlink.active{background:var(--raised); color:var(--fg);}
  .side-foot{margin-top:auto; padding:14px 12px 0; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);}
  .livedot{width:7px; height:7px; border-radius:50%; background:var(--success); box-shadow:0 0 0 3px rgba(125,154,126,.22);}

  /* ---- Topbar ---- */
  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    gap:12px; border-bottom:1px solid var(--border); background:rgba(10,11,10,.92); backdrop-filter:blur(6px);
    padding:14px 18px;}
  .topbar h1{font-family:var(--font-display); font-size:22px; font-weight:600; margin:0;}
  .clock{font-family:var(--font-mono); font-size:12px; color:var(--muted);}
  .refresh-pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; border:1px solid var(--border); border-radius:999px; padding:5px 10px;}

  main{padding:20px 18px 90px;}
  @media(min-width:860px){
    .sidebar{display:flex;}
    .topbar, main{margin-left:236px;}
    main{padding:26px 32px 40px;}
    .bottomnav{display:none;}
  }

  /* ---- Bottom nav (mobile) ---- */
  .bottomnav{position:fixed; inset:auto 0 0 0; z-index:20; display:grid; grid-template-columns:repeat(6,1fr);
    border-top:1px solid var(--border); background:rgba(18,20,18,.96); backdrop-filter:blur(6px);
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));}
  .navlink.bottom{flex-direction:column; gap:3px; padding:8px 2px; font-size:9px; text-transform:uppercase;
    letter-spacing:.04em; text-align:center; border-radius:10px;}
  .navlink.bottom svg{width:18px; height:18px;}

  /* ---- Shared bits ---- */
  .kpi-row{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:18px;}
  @media(min-width:640px){ .kpi-row{grid-template-columns:repeat(4,1fr);} }
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px;}
  .kpi .n{font-family:var(--font-display); font-size:32px; font-weight:600; line-height:1;}
  .kpi .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:6px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px; margin-bottom:16px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .card-head h2{font-family:var(--font-display); font-size:18px; font-weight:600; margin:0;}
  .card-head .meta{font-size:12px; color:var(--muted);}

  .grid2{display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:1024px){ .grid2{grid-template-columns:1.3fr 1fr;} }

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint);
    font-weight:500; padding:0 10px 10px 0;}
  td{padding:11px 10px 11px 0; border-top:1px solid var(--border); vertical-align:middle;}
  tr:first-child td{border-top:none;}
  .row-click{cursor:pointer;}
  .row-click:active{opacity:.7;}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:10px; text-transform:uppercase;
    letter-spacing:.05em; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .badge.on{color:var(--success); background:rgba(125,154,126,.14);}
  .badge.off{color:var(--faint); background:var(--raised);}
  .badge.warn{color:var(--warning); background:rgba(185,160,106,.14);}
  .badge.danger{color:var(--danger); background:rgba(176,112,100,.14);}
  .badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

  .empty{color:var(--muted); font-size:13px; padding:24px 0; text-align:center;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:var(--r-md);
    padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;}
  .btn-primary{background:var(--accent); color:var(--accent-fg);}
  .btn-secondary{background:var(--raised); color:var(--fg); border:1px solid var(--border);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn:disabled{opacity:.45;}
  .btn-sm{padding:7px 12px; font-size:12px;}

  label{display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:12px 0 6px;}
  input[type=text], input[type=tel], input[type=number], select, textarea{
    width:100%; background:var(--raised); border:1px solid var(--border); color:var(--fg);
    border-radius:var(--r-md); padding:10px 12px; font-size:14px; font-family:inherit; outline:none;}
  input:focus, select:focus, textarea:focus{border-color:var(--ring);}
  textarea{min-height:80px; resize:vertical;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .modal-backdrop{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); display:flex;
    align-items:flex-end; justify-content:center;}
  @media(min-width:640px){ .modal-backdrop{align-items:center;} }
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl) var(--r-xl) 0 0;
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:22px; position:relative;}
  @media(min-width:640px){ .modal{border-radius:var(--r-xl);} }
  .modal h3{font-family:var(--font-display); font-size:20px; margin:0 0 4px; padding-right:24px;}
  .modal-close{position:absolute; top:18px; right:18px; color:var(--muted); cursor:pointer; line-height:1;}
  .modal-close svg{width:18px; height:18px; display:block;}

  .map-wrap{position:relative; border-radius:var(--r-lg); overflow:hidden; background:var(--raised); border:1px solid var(--border);
    height:340px;}
  .map-wrap svg{display:block; width:100%; height:auto;}
  #mapHolder{height:340px; border-radius:var(--r-lg); overflow:hidden; border:1px solid var(--border);}
  .leaflet-container{background:var(--raised) !important; font-family:var(--font-sans) !important;}
  .leaflet-popup-content-wrapper, .leaflet-popup-tip{background:var(--surface) !important; color:var(--fg) !important;}
  .leaflet-control-attribution{background:rgba(10,11,10,.7) !important; color:var(--faint) !important; font-size:9px !important;}
  .leaflet-control-attribution a{color:var(--muted) !important;}
  .map-tooltip{background:var(--surface) !important; border:1px solid var(--border) !important; color:var(--fg) !important;
    font-family:var(--font-mono) !important; font-size:11px !important; box-shadow:none !important;}
  .officer-photo{width:34px; height:34px; border-radius:50%; background:var(--raised); border:1px solid var(--border);
    display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); overflow:hidden;}
  .officer-photo img{width:100%; height:100%; object-fit:cover;}

  .toast{position:fixed; left:20px; right:20px; bottom:calc(80px + env(safe-area-inset-bottom)); z-index:60;
    background:var(--raised); border:1px solid var(--border); color:var(--fg); padding:13px 16px;
    border-radius:var(--r-md); font-size:13px; text-align:center;}
  @media(min-width:860px){ .toast{left:auto; right:32px; bottom:32px; max-width:320px;} }
  .toast.success{border-color:var(--success);} .toast.danger{border-color:var(--danger);}

  .photo-grid{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .photo-grid img{width:64px; height:64px; object-fit:cover; border-radius:var(--r-sm); border:1px solid var(--border);}
  .err{color:var(--danger); font-size:12px; margin-top:8px;}
  .subtle-link{color:var(--muted); font-size:12px; cursor:pointer;}
  .qr-box{display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px; background:var(--raised);
    border-radius:var(--r-md); margin-top:10px;}
  .qr-box canvas{border-radius:8px;}
  .checkpoint-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border);}
  .checkpoint-row:first-child{border-top:none;}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
// =========================================================
// CONFIG
// =========================================================
const SUPABASE_URL = "https://raedwcoztdpwvvmzvdmz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhZWR3Y296dGRwd3Z2bXp2ZG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTU5MDgsImV4cCI6MjEwMjY5MTkwOH0.FSCVAzugN5hfAeruGjytgsjOGegLmR3fdWYHlrqs5sg";
const STORAGE_BUCKET = "lion-patrol";
const REFRESH_MS = 12000;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =========================================================
// Icons (inline, stroke-based, no external icon deps)
// =========================================================
const ic = {
  command: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>`,
  officers: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  sites: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5z"/></svg>`,
  patrols: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  incidents: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 1 21h22L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>`,
  dispatch: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.4M16.2 7.8c2.3 2.3 2.3 6.1 0 8.4M19.1 4.9c3.9 3.9 3.9 10.3 0 14.2"/><circle cx="12" cy="12" r="2"/></svg>`,
  lion: `<svg viewBox="0 0 64 64" fill="currentColor"><path d="M14 50c3.2-7.4 7.1-12.4 12.4-16.2-.5-3.6.3-7.7 3.2-10.4 2.5-2.3 6-3 9.2-2 .9-3 3.7-5.5 7.4-6 .7 3.2-.3 6.4-2.6 8.4 2.8 1.6 4.6 4.6 4.6 8 0 2.4-.9 4.6-2.4 6.3 3.6 3.6 6.1 8.1 7.6 11.9H14zm17.2-21c-1.6 1.3-2.2 3.5-1.7 5.5l7.5-2.4c-.4-2.6-3-4.5-5.8-3.1z"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>`,
};

const NAV = [
  {id:"command", label:"Command", icon:ic.command},
  {id:"officers", label:"Officers", icon:ic.officers},
  {id:"sites", label:"Sites", icon:ic.sites},
  {id:"patrols", label:"Patrols", icon:ic.patrols},
  {id:"incidents", label:"Incidents", icon:ic.incidents},
  {id:"dispatch", label:"Messages", icon:ic.dispatch},
];

// =========================================================
// State
// =========================================================
let DATA = {sites:[], officers:[], shifts:[], patrols:[], checkpoints:[], scans:[], incidents:[], dispatches:[], messages:[], patrolReports:[], pings:{}};
let currentTab = "command";
let loadError = null;
let signedUrlCache = {}; // path -> signed url

function byId(arr){ const m={}; (arr||[]).forEach(x=>m[x.id]=x); return m; }

async function fetchAll(){
  try{
    const [sites, officers, shifts, patrols, checkpoints, scans, incidents, dispatches, messages, patrolReports, pings] = await Promise.all([
      sb.from("sites").select("*").order("name"),
      sb.from("officers").select("*").order("name"),
      sb.from("shifts").select("*").order("starts_at", {ascending:false}).limit(200),
      sb.from("patrols").select("*").order("started_at", {ascending:false}).limit(100),
      sb.from("checkpoints").select("*").order("seq"),
      sb.from("checkpoint_scans").select("*").order("scanned_at", {ascending:false}).limit(300),
      sb.from("incidents").select("*").order("occurred_at", {ascending:false}).limit(150),
      sb.from("dispatches").select("*").order("created_at", {ascending:false}).limit(150),
      sb.from("messages").select("*").order("created_at", {ascending:true}).limit(500),
      sb.from("patrol_reports").select("*").order("ended_at", {ascending:false}).limit(150),
      sb.from("location_pings").select("*").order("recorded_at", {ascending:false}).limit(500),
    ]);
    for(const r of [sites,officers,shifts,patrols,checkpoints,scans,incidents,dispatches,messages,patrolReports,pings]){
      if(r.error) throw r.error;
    }
    // Reduce pings to latest per officer
    const latest = {};
    for(const p of (pings.data||[])){
      if(!latest[p.officer_id]) latest[p.officer_id] = p;
    }
    DATA = {
      sites: sites.data||[], officers: officers.data||[], shifts: shifts.data||[],
      patrols: patrols.data||[], checkpoints: checkpoints.data||[], scans: scans.data||[],
      incidents: incidents.data||[], dispatches: dispatches.data||[], messages: messages.data||[],
      patrolReports: patrolReports.data||[], pings: latest,
    };
    loadError = null;
  }catch(e){
    loadError = e.message || "Failed to load data";
  }
}

function toast(msg, kind="default"){
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3400);
}

async function getSignedUrl(path){
  if(!path) return null;
  if(signedUrlCache[path]) return signedUrlCache[path];
  const {data, error} = await sb.storage.from(STORAGE_BUCKET).createSignedUrl(path, 3600);
  if(error || !data) return null;
  signedUrlCache[path] = data.signedUrl;
  return data.signedUrl;
}

function fmtTime(iso){ if(!iso) return "—"; return new Date(iso).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
function fmtDateTime(iso){ if(!iso) return "—"; return new Date(iso).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}); }
function timeAgo(iso){
  if(!iso) return "—";
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s<60) return s+"s ago";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

// =========================================================
// Shell
// =========================================================
const app = document.getElementById("app");

function renderShell(){
  const activeItem = NAV.find(n=>n.id===currentTab);
  app.innerHTML = `
    <aside class="sidebar">
      <div class="brand">${ic.lion}<div><div class="l">Lion</div><div class="s">Command</div></div></div>
      <nav class="navlist">
        ${NAV.map(n=>`<button class="navlink ${n.id===currentTab?"active":""}" data-tab="${n.id}">${n.icon}<span>${n.label}</span></button>`).join("")}
      </nav>
      <div class="side-foot"><span class="livedot"></span> Live · updates every ${REFRESH_MS/1000}s</div>
    </aside>

    <header class="topbar">
      <h1>${activeItem?.label || "Command"}</h1>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="refresh-pill"><span class="livedot" style="width:6px;height:6px;"></span>Live</span>
        <span class="clock" id="clockEl"></span>
      </div>
    </header>

    <main id="mainEl"></main>

    <nav class="bottomnav">
      ${NAV.map(n=>`<button class="navlink bottom ${n.id===currentTab?"active":""}" data-tab="${n.id}">${n.icon}<span>${n.label}</span></button>`).join("")}
    </nav>
  `;

  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.onclick = ()=>{ currentTab = btn.dataset.tab; renderShell(); };
  });

  tickClock();
  renderMain();
}

function tickClock(){
  const el = document.getElementById("clockEl");
  if(!el) return;
  el.textContent = new Date().toLocaleString([], {weekday:"short", hour:"2-digit", minute:"2-digit", second:"2-digit"});
}
setInterval(()=>{ const el=document.getElementById("clockEl"); if(el) tickClock(); }, 1000);

function renderMain(){
  const main = document.getElementById("mainEl");
  if(!main) return;
  if(loadError){
    main.innerHTML = `<div class="card"><div class="empty">Couldn't load data — ${loadError}</div></div>`;
    return;
  }
  const renderers = {
    command: renderCommand, officers: renderOfficers, sites: renderSites,
    patrols: renderPatrols, incidents: renderIncidents, dispatch: renderDispatch,
  };
  (renderers[currentTab] || renderCommand)(main);
}

// =========================================================
// COMMAND
// =========================================================
let leafletMap = null, siteLayer = null, officerLayer = null;

function renderCommand(main){
  main.innerHTML = `
    <div class="kpi-row">
      <div class="kpi"><div class="n" id="kpiOnDuty">0</div><div class="l">On Duty</div></div>
      <div class="kpi"><div class="n" id="kpiPatrols">0</div><div class="l">Active Patrols</div></div>
      <div class="kpi"><div class="n" id="kpiIncidents">0</div><div class="l">Open Incidents</div></div>
      <div class="kpi"><div class="n" id="kpiAlerts">0</div><div class="l">Sites on Alert</div></div>
    </div>

    <div class="grid2">
      <div>
        <div class="card">
          <div class="card-head"><h2>Field Map</h2><span class="meta">${DATA.sites.length} sites</span></div>
          <div id="mapHolder"></div>
          <div style="display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--muted);">
            <span style="display:flex; align-items:center; gap:5px;"><span style="width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;"></span>Site</span>
            <span style="display:flex; align-items:center; gap:5px;"><span style="width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;"></span>Officer (live)</span>
            <span style="display:flex; align-items:center; gap:5px;"><span style="width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block;"></span>Officer (stale)</span>
          </div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="card-head"><h2>Recent Incidents</h2></div>
          <div id="recentIncidentsList"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Recent Messages</h2></div>
          <div id="recentDispatchesList"></div>
        </div>

function initCommandMap(){
  const holder = document.getElementById("mapHolder");
  if(!holder) return;
  if(leafletMap){ leafletMap.remove(); leafletMap = null; }

  leafletMap = L.map(holder, {zoomControl:true, attributionControl:true}).setView([47.6062,-122.3321], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; OpenStreetMap contributors &copy; CARTO', subdomains:'abcd', maxZoom:19
  }).addTo(leafletMap);
  siteLayer = L.layerGroup().addTo(leafletMap);
  officerLayer = L.layerGroup().addTo(leafletMap);
}

function updateCommandLive(){
  const onDuty = DATA.officers.filter(o=>o.status==="on_duty").length;
  const openIncidents = DATA.incidents.filter(i=>i.status!=="resolved").length;
  const activePatrols = DATA.patrols.filter(p=>p.status==="active").length;
  const sitesAlert = DATA.sites.filter(s=>s.status==="alert").length;

  const kOn = document.getElementById("kpiOnDuty"); if(kOn) kOn.textContent = onDuty;
  const kP = document.getElementById("kpiPatrols"); if(kP) kP.textContent = activePatrols;
  const kI = document.getElementById("kpiIncidents"); if(kI){ kI.textContent = openIncidents; kI.style.color = openIncidents>0 ? "var(--warning)" : ""; }
  const kA = document.getElementById("kpiAlerts"); if(kA){ kA.textContent = sitesAlert; kA.style.color = sitesAlert>0 ? "var(--danger)" : ""; }

  const officerById = byId(DATA.officers);
  const siteById = byId(DATA.sites);

  const incList = document.getElementById("recentIncidentsList");
  if(incList){
    const recent = DATA.incidents.slice(0,5);
    incList.innerHTML = recent.length ? recent.map(i=>`
      <div style="padding:10px 0; border-top:1px solid var(--border);">
        <div style="display:flex; justify-content:space-between; gap:8px;">
          <span style="font-size:13px;">${escapeHtml(i.title)}</span>
          <span class="badge ${i.severity==='high'?'danger':i.severity==='medium'?'warn':'off'}">${i.severity}</span>
        </div>
        <div style="font-size:11px; color:var(--muted); margin-top:3px;">${siteById[i.site_id]?.name||"—"} · ${timeAgo(i.occurred_at)}</div>
      </div>
    `).join("") : `<div class="empty">No incidents yet</div>`;
  }

  const dispList = document.getElementById("recentDispatchesList");
  if(dispList){
    const recent = DATA.dispatches.slice(0,5);
    dispList.innerHTML = recent.length ? recent.map(d=>`
      <div style="padding:10px 0; border-top:1px solid var(--border);">
        <div style="font-size:13px;">${escapeHtml(d.message)}</div>
        <div style="font-size:11px; color:var(--muted); margin-top:3px;">to ${officerById[d.officer_id]?.name||"—"} · ${timeAgo(d.created_at)} · ${d.status}</div>
      </div>
    `).join("") : `<div class="empty">No dispatches yet</div>`;
  }

  updateMapMarkers();
}

function updateMapMarkers(){
  if(!leafletMap || !siteLayer || !officerLayer) return;
  siteLayer.clearLayers();
  officerLayer.clearLayers();

  const bounds = [];
  const statusColor = {secure:"var(--accent)", alert:"var(--danger)", unmanned:"var(--faint)"};

  DATA.sites.forEach(s=>{
    if(s.lat==null || s.lng==null) return;
    const color = getCssColor(statusColor[s.status] || statusColor.secure);
    L.circleMarker([s.lat, s.lng], {radius:8, color, fillColor:color, fillOpacity:0.85, weight:2})
      .bindTooltip(s.code, {permanent:true, direction:"right", className:"map-tooltip", offset:[8,0]})
      .addTo(siteLayer);
    bounds.push([s.lat, s.lng]);
  });

  const officerById = byId(DATA.officers);
  const now = Date.now();
  Object.entries(DATA.pings).forEach(([officerId, ping])=>{
    const o = officerById[officerId];
    if(!o || o.status !== "on_duty" || ping.lat==null || ping.lng==null) return;
    const fresh = (now - new Date(ping.recorded_at).getTime()) < 5*60*1000;
    const color = fresh ? getCssColor("var(--success)") : getCssColor("var(--faint)");
    L.circleMarker([ping.lat, ping.lng], {radius:7, color, fillColor:color, fillOpacity:0.9, weight:2})
      .bindTooltip(o.callsign, {permanent:true, direction:"top", className:"map-tooltip", offset:[0,-6]})
      .addTo(officerLayer);
    bounds.push([ping.lat, ping.lng]);
  });

  if(bounds.length === 1){
    leafletMap.setView(bounds[0], 14);
  } else if(bounds.length > 1){
    leafletMap.fitBounds(bounds, {padding:[30,30], maxZoom:16});
  }
}

function getCssColor(varExpr){
  // Resolves a css var(--x) string to its actual computed color value
  const el = document.createElement("div");
  el.style.color = varExpr;
  document.body.appendChild(el);
  const resolved = getComputedStyle(el).color;
  el.remove();
  return resolved;
}

      if(error){ toast("Couldn't delete patrol", "danger"); return; }
      toast("Patrol deleted", "success");
      await fetchAll(); renderMain();
    };
  });
  document.getElementById("exportPatrolReportsBtn").onclick = ()=>{
    exportCsv("patrol-reports.csv", DATA.patrolReports.map(r=>({
      site: siteById[r.site_id]?.name || "", officer: officerById[r.officer_id]?.name || "",
      patrol_type: r.patrol_type, started_at: r.started_at, ended_at: r.ended_at,
      areas_patrolled: r.areas_patrolled, activity_types: (r.activity_types||[]).join("; "), details: r.details,
    })));
  };
}

let incidentSearch = "";

function renderIncidents(main){
  const siteById = byId(DATA.sites);
  const officerById = byId(DATA.officers);
  const filtered = DATA.incidents.filter(i=>{
    const q = incidentSearch.toLowerCase();
    return !q || i.title.toLowerCase().includes(q) || (i.description||"").toLowerCase().includes(q) || i.category.toLowerCase().includes(q);
  });

  main.innerHTML = `
    <div class="card">
      <div class="card-head">
        <h2>Incidents</h2>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="meta">${filtered.length} of ${DATA.incidents.length}</span>
          <button class="btn btn-secondary btn-sm" id="exportIncidentsBtn">Export CSV</button>
        </div>
      </div>
      <input type="text" id="incidentSearchInput" placeholder="Search title, description, category…" value="${escapeHtml(incidentSearch)}" style="margin-bottom:6px;" />
      ${filtered.length ? filtered.map(i=>`
        <div class="row-click" data-incident="${i.id}" style="padding:14px 0; border-top:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
            <div>
              <div style="font-size:14px; font-weight:500;">${escapeHtml(i.title)}</div>
              <div style="font-size:12px; color:var(--muted); margin-top:3px;">
                ${siteById[i.site_id]?.name || "—"} · ${officerById[i.officer_id]?.name || "Unknown"} · ${timeAgo(i.occurred_at)}
              </div>
            </div>
            <div style="display:flex; gap:6px; flex-shrink:0;">
              <span class="badge ${i.severity==='high'?'danger':i.severity==='medium'?'warn':'off'}">${i.severity}</span>
              <span class="badge ${i.status==='resolved'?'on':i.status==='investigating'?'warn':'off'}">${i.status}</span>
            </div>
          </div>
        </div>
      `).join("") : `<div class="empty">${incidentSearch ? "No incidents match" : "No incidents reported"}</div>`}
    </div>
  `;
  document.querySelectorAll("[data-incident]").forEach(row=>{
    row.onclick = ()=> openIncidentDetail(row.dataset.incident);
  });
  const searchInput = document.getElementById("incidentSearchInput");
  searchInput.oninput = (e)=>{ incidentSearch = e.target.value; renderIncidents(main); };
  searchInput.focus();
  searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length;

  document.getElementById("exportIncidentsBtn").onclick = ()=>{
    exportCsv("incidents.csv", filtered.map(i=>({
      title: i.title, category: i.category, severity: i.severity, status: i.status,
      site: siteById[i.site_id]?.name || "", officer: officerById[i.officer_id]?.name || "",
      occurred_at: i.occurred_at, description: i.description,
    })));
  };
}

function exportCsv(filename, rows){
  if(!rows.length){ toast("Nothing to export", "danger"); return; }
  const headers = Object.keys(rows[0]);
  const escapeCsv = (v)=>{
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const csv = [headers.join(","), ...rows.map(r=>headers.map(h=>escapeCsv(r[h])).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function openIncidentDetail(incidentId){
  const i = DATA.incidents.find(x=>x.id===incidentId);
  if(!i) return;
  const siteById = byId(DATA.sites);
  const officerById = byId(DATA.officers);

  showModal(`
    <h3>Edit Incident</h3>
    <div style="color:var(--muted); font-size:13px; margin-bottom:14px;">
      ${siteById[i.site_id]?.name || "—"} · ${officerById[i.officer_id]?.name || "Unknown"} · ${fmtDateTime(i.occurred_at)}
    </div>
    <label>Title</label>
    <input type="text" id="editTitle" value="${escapeHtml(i.title)}" />
    <div class="field-row">
      <div><label>Category</label>
        <select id="editCategory">
          ${["general","access","safety","property","medical"].map(c=>`<option value="${c}" ${i.category===c?"selected":""}>${c}</option>`).join("")}
        </select>
      </div>
      <div><label>Severity</label>
        <select id="editSeverity">
          ${["low","medium","high"].map(s=>`<option value="${s}" ${i.severity===s?"selected":""}>${s}</option>`).join("")}
        </select>
      </div>
    </div>
    <label>Description</label>
    <textarea id="editDescription">${escapeHtml(i.description)}</textarea>
    <div class="photo-grid" id="incidentPhotos"></div>
    <label>Status</label>
    <select id="statusSelect">
      <option value="open" ${i.status==='open'?'selected':''}>Open</option>
      <option value="investigating" ${i.status==='investigating'?'selected':''}>Investigating</option>
      <option value="resolved" ${i.status==='resolved'?'selected':''}>Resolved</option>
    </select>
    <div class="err" id="editErr"></div>
    <button class="btn btn-primary" id="statusSave" style="width:100%; margin-top:14px;">Save Changes</button>
    <button class="btn btn-danger" id="deleteIncidentBtn" style="width:100%; margin-top:8px;">Delete Incident</button>
  `);

  const photosEl = document.getElementById("incidentPhotos");
  for(const path of (i.photo_urls||[])){
    const url = await getSignedUrl(path);
    if(url){
      const img = document.createElement("img");
      img.src = url;
      photosEl.appendChild(img);
    }
  }

  document.getElementById("statusSave").onclick = async ()=>{
    const btn = document.getElementById("statusSave"); btn.disabled = true; btn.textContent = "Saving…";
    const {error} = await sb.from("incidents").update({
      title: document.getElementById("editTitle").value.trim(),
      category: document.getElementById("editCategory").value,
      severity: document.getElementById("editSeverity").value,
      description: document.getElementById("editDescription").value.trim(),
      status: document.getElementById("statusSelect").value,
    }).eq("id", i.id);
    if(error){ document.getElementById("editErr").textContent = "Couldn't save changes."; btn.disabled=false; btn.textContent="Save Changes"; return; }
    closeModal();
    toast("Incident updated", "success");
    await fetchAll(); renderMain();
  };

  document.getElementById("deleteIncidentBtn").onclick = async ()=>{
    if(!confirm(`Delete "${i.title}"? This can't be undone.`)) return;
    const {error} = await sb.from("incidents").delete().eq("id", i.id);
    if(error){ toast("Couldn't delete incident", "danger"); return; }
    closeModal();
    toast("Incident deleted", "success");
    await fetchAll(); renderMain();
  };
}

// =========================================================
// MESSAGES (formerly Dispatch — now real two-way chat)
// =========================================================
let selectedChatOfficer = null;

function renderDispatch(main){
  const officers = DATA.officers;
  main.innerHTML = `
    <div class="grid2">
      <div class="card">
        <div class="card-head"><h2>Officers</h2></div>
        ${officers.length ? officers.map(o=>{
          const msgCount = DATA.messages.filter(m=>m.officer_id===o.id).length;
          return `<div class="row-click chat-officer-row ${selectedChatOfficer===o.id?'active':''}" data-chatofficer="${o.id}"
            style="display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-top:1px solid var(--border);">
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="officer-photo">${o.name.split(" ").map(x=>x[0]).slice(0,2).join("")}</div>
              <div>
                <div style="font-size:13px;">${escapeHtml(o.name)}</div>
                <div style="font-size:11px; color:var(--muted);">${o.status==='on_duty'?'On duty':'Off duty'}</div>
              </div>
            </div>
            ${msgCount ? `<span style="font-size:11px; color:var(--muted);">${msgCount}</span>` : ""}
          </div>`;
        }).join("") : `<div class="empty">No officers yet</div>`}
      </div>
      <div class="card" style="display:flex; flex-direction:column; min-height:420px;">
        <div class="card-head"><h2 id="chatHeader">Select an officer</h2></div>
        <div id="chatList" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px 0; max-height:360px;"></div>
        <div id="chatInputRow" style="display:none; gap:8px; margin-top:10px;">
          <input type="text" id="chatInput" placeholder="Type a message…" />
          <button class="btn btn-primary btn-sm" id="chatSendBtn" style="flex-shrink:0;">Send</button>
        </div>
      </div>
    </div>
  `;
  document.querySelectorAll("[data-chatofficer]").forEach(row=>{
    row.onclick = ()=> openChatWith(row.dataset.chatofficer);
  });
  if(selectedChatOfficer) openChatWith(selectedChatOfficer, true);
}

function openChatWith(officerId, skipRerenderList){
  selectedChatOfficer = officerId;
  const o = DATA.officers.find(x=>x.id===officerId);
  if(!skipRerenderList) renderDispatch(document.getElementById("mainEl"));
  const header = document.getElementById("chatHeader");
  const inputRow = document.getElementById("chatInputRow");
  if(header) header.textContent = o ? o.name : "Officer";
  if(inputRow) inputRow.style.display = "flex";
  drawChatMessages();

  const sendBtn = document.getElementById("chatSendBtn");
  const input = document.getElementById("chatInput");
  if(sendBtn){
    sendBtn.onclick = async ()=>{
      const body = input.value.trim();
      if(!body) return;
      input.value = "";
      const officer = DATA.officers.find(x=>x.id===selectedChatOfficer);
      const {error} = await sb.from("messages").insert({
        officer_id: selectedChatOfficer, site_id: officer?.site_id || null, sender:"admin", body
      });
      if(error){ toast("Couldn't send", "danger"); return; }
      await fetchAll();
      drawChatMessages();
    };
  }
  if(input){
    input.onkeydown = (e)=>{ if(e.key==="Enter") document.getElementById("chatSendBtn")?.click(); };
  }
}

function drawChatMessages(){
  const list = document.getElementById("chatList");
  if(!list || !selectedChatOfficer) return;
  const thread = DATA.messages.filter(m=>m.officer_id===selectedChatOfficer);
  list.innerHTML = thread.length ? thread.map(m=>`
    <div style="display:flex; justify-content:${m.sender==='admin'?'flex-end':'flex-start'};">
      <div style="max-width:75%; padding:9px 12px; border-radius:12px; font-size:13px; line-height:1.35;
        ${m.sender==='admin' ? 'background:var(--accent); color:var(--accent-fg); border-bottom-right-radius:3px;' : 'background:var(--raised); border:1px solid var(--border); border-bottom-left-radius:3px;'}">
        ${escapeHtml(m.body)}
      </div>
    </div>
  `).join("") : `<div class="empty">No messages yet — say hello</div>`;
  list.scrollTop = list.scrollHeight;
}



// =========================================================
// Modal helpers
// =========================================================
function showModal(innerHtml){
  const existing = document.getElementById("modalBackdrop");
  if(existing) existing.remove();
  const backdrop = document.createElement("div");
  backdrop.id = "modalBackdrop";
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `<div class="modal"><span class="modal-close" id="modalCloseBtn">${ic.x}</span>${innerHtml}</div>`;
  backdrop.onclick = (e)=>{ if(e.target === backdrop) closeModal(); };
  document.body.appendChild(backdrop);
  document.getElementById("modalCloseBtn").onclick = closeModal;
}
function closeModal(){
  const el = document.getElementById("modalBackdrop");
  if(el) el.remove();
}

function escapeHtml(str){
  if(str===null || str===undefined) return "";
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// =========================================================
// Boot
// =========================================================
async function boot(){
  await fetchAll();
  renderShell();
  setInterval(async ()=>{
    await fetchAll();
    if(currentTab === "command" && leafletMap){
      updateCommandLive();
    } else {
      renderMain();
    }
  }, REFRESH_MS);
}
boot();
